services:
  # Интерактивный CLI / меню — вызывается по запросу через SSH
  cli:
    build: .
    image: stalcraft-calc:latest
    env_file: .env
    volumes:
      - ./database:/app/database
    stdin_open: true
    tty: true
    command: []      # = menu

  # Демон сбора истории (если нужен)
  collector:
    build: .
    image: stalcraft-calc:latest
    env_file: .env
    volumes:
      - ./database:/app/database
    restart: unless-stopped
    entrypoint: ["python", "-m", "scripts.collect_history"]
    command: [ "--all-listing", "--every", "7200", "--limit", "200", "--keep-days", "30", "--verbose" ]