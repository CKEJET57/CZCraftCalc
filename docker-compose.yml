services:
  # Интерактивный CLI / меню — вызывается по запросу через SSH
  cli:
    build: .
    image: stalcraft-calc:latest
    env_file: .env
    volumes:
      - ./database:/app/database
    stdin_open: true
    tty: true
    command: []      # = menu

  web:
    build: .
    image: stalcraft-calc:latest
    env_file: .env
    volumes:
      - ./database:/app/database
    ports:
      - "8000:8000"
    restart: unless-stopped
    entrypoint: ["uvicorn", "server.app:app", "--host", "0.0.0.0", "--port", "8000"]

  # Демон сбора истории (если нужен)
  collector:
    build: .
    image: stalcraft-calc:latest
    env_file: .env
    volumes:
      - ./database:/app/database
    restart: unless-stopped
    entrypoint: ["python", "-m", "scripts.collect_history"]
    command: [ "--all-listing", "--every", "7200", "--limit", "200", "--keep-days", "30", "--verbose" ]

  # Разовая почасовая агрегация и публикация сделок в GitHub.
  # Запуск: docker compose run --rm publisher [--dry-run]
  publisher:
    build: .
    image: stalcraft-calc:latest
    profiles: ["tools"]
    env_file: .env
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-CKEJET57/CZCraftCalc}
      GITHUB_DATA_BRANCH: ${GITHUB_DATA_BRANCH:-market-data}
      GITHUB_BASE_BRANCH: ${GITHUB_BASE_BRANCH:-feature/monorepo}
    volumes:
      - ./database:/app/database
    entrypoint: ["python", "-m", "scripts.publish_deals"]
    restart: "no"
